# Selective Policy — per-tool override without code changes
#
# The developer coded get_price as open (no badge required), but
# the platform admin decides it now requires a badge too.
# This override takes effect instantly — no code deploy needed.
#
# Use case: a tool that was originally public now handles sensitive
# data; compliance requires restricting access at the platform level.
#
# Expected outcomes with this policy active:
#   Badged agent    → get_price       → ALLOW  (has badge)
#   Badged agent    → place_order     → ALLOW  (has badge)
#   Unbadged agent  → get_price       → DENY   (no badge)
#   Unbadged agent  → place_order     → DENY   (no badge)

version: "1"
min_trust_level: ""
allowed_dids: []
denied_dids: []
mcp_tools:
  - tool: "get_price"
    min_trust_level: "REG"
    allowed_dids: []
    denied_dids: []
  - tool: "place_order"
    min_trust_level: "REG"
    allowed_dids: []
    denied_dids: []
  - tool: "cancel_all_orders"
    min_trust_level: "REG"
    allowed_dids: []
    denied_dids: []
